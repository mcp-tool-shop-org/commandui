name: CI

# Per-run cost, measured from a real run (run 37153239657, 2026-10-03):
# one check-and-test job on ubuntu-latest, 3m09s wall (about 4 billed minutes).
# A cold-cache run (36922825113) took 12m02s. Each PR commit runs once
# (pull_request); pushes run only on main.
# windows-shells, measured on run 37168387421 (2026-10-04): 3m44s wall on
# windows-latest, about 8 billed minutes at the 2x Windows rate. Most of it
# is the live shells starting one at a time.

on:
  push:
    # A branch with no open PR gets no automatic run; PR commits are covered
    # by the pull_request trigger, so pushes are main-only (no double fire).
    branches: [main]
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'packages/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '**/tsconfig*.json'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'
      - 'packaging/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
      - 'atlas/**'
      - 'codecov.yml'
  # `check-and-test` is a REQUIRED status check on main, but no workflow in
  # this repo had a pull_request trigger -- so the job ran on push, never on a
  # PR head, and every pull request was unmergeable by construction with no
  # failing check to point at. Found 2026-09-17 on the PR migrating site/ off
  # an astro release that cannot hold the sharp patch.
  # No paths filter on pull requests, deliberately: this workflow emits the
  # required status check, and a PR that matched no path (a docs-only change)
  # would never report it and could never merge. Pushes to main stay
  # paths-gated.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # pnpm version comes from package.json packageManager (same as release).
      # One Node setup (22, pnpm cache) serves the Atlas check and the workspace steps.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: pnpm

      # Accepted risk (F-ebc8f058): the engine is pinned to an exact version as
      # the org Atlas rule requires, but npx has no lockfile or integrity pin, so
      # its transitive dependencies resolve at run time. A failure would be loud
      # and fixable, not a release-path break. If flakes appear, vendor Atlas as
      # a devDependency in the pnpm lockfile.
      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7
        with:
          tool: cargo-llvm-cov

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Sources the installers are built from must agree before a tag exists.
      - name: Release version sources agree
        run: node packaging/check-release-version.mjs --self

      # zsh is not on ubuntu-latest by default; the live shell tests require
      # bash and zsh here so a missing shell fails instead of skipping.
      - name: Install zsh for the live shell tests
        run: sudo apt-get install -y zsh

      # Same tests as before, run under cargo-llvm-cov for the Codecov rust flag.
      - name: Cargo test with coverage (crates)
        env:
          COMMANDUI_REQUIRE_SHELLS: bash,zsh
        run: |
          mkdir -p coverage
          cargo llvm-cov --lcov --output-path coverage/rust.lcov --remap-path-prefix             -p commandui-runtime-core -p commandui-runtime-persistence -p commandui-runtime-planner             -p commandui-console -p commandui-desktop

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Vitest transpiles with esbuild and does not run tsc. The desktop
      # release build fails on type errors this job would otherwise miss.
      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm test with coverage
        run: pnpm test:coverage

      # Vitest writes lcov paths relative to each package; prefix them so
      # Codecov can match files in a monorepo with many src/index.ts.
      - name: Merge TypeScript coverage
        run: |
          : > coverage/typescript.lcov
          for f in apps/*/coverage/lcov.info packages/*/coverage/lcov.info; do
            [ -f "$f" ] || continue
            sed "s|^SF:|SF:${f%/coverage/lcov.info}/|" "$f" >> coverage/typescript.lcov
          done
          test -s coverage/typescript.lcov

      - name: Save coverage for Codecov
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage/*.lcov
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      # jsdom has no layout, so the unit suite cannot see a zoomed shell.
      # This is Chromium on the built frontend, separate from pnpm test.
      - name: Large-text layout in Chromium
        working-directory: apps/desktop
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:layout

      - name: pnpm audit
        run: pnpm audit --audit-level=high

  # Uploads with OIDC (no token). Status gates live in codecov.yml: the rust
  # flag and every patch must reach 90%; typescript is informational.
  codecov:
    needs: check-and-test
    if: ${{ needs.check-and-test.result == 'success' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codecov-coverage
          path: coverage
      - name: Upload Rust coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: coverage/rust.lcov
          flags: rust
      - name: Upload TypeScript coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: coverage/typescript.lcov
          flags: typescript

  # The runtime drives real shells through a Windows ConPTY: line endings,
  # repaint-by-position output and clear-line keys all differ from a Unix PTY,
  # and byte-level unit tests passed for a year while no Windows session could
  # start. tests/live_shell.rs starts cmd, Windows PowerShell 5.1, pwsh 7 and
  # Git Bash (all on the windows-latest image) and runs a command in each.
  # Windows-only by necessity; one job, runtime-core only.
  windows-shells:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # With the flag set, live_shell.rs fails on a missing pwsh or Git Bash
      # instead of skipping, so this job cannot pass without testing them.
      - name: Cargo test (runtime-core, live shells)
        env:
          COMMANDUI_REQUIRE_SHELLS: "1"
        run: cargo test -p commandui-runtime-core
