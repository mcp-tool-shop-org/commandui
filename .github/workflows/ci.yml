name: CI

on:
  push:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
      - 'atlas/**'
  # `check-and-test` is a REQUIRED status check on main, but no workflow in
  # this repo had a pull_request trigger -- so the job ran on push, never on a
  # PR head, and every pull request was unmergeable by construction with no
  # failing check to point at. Found 2026-09-17 on the PR migrating site/ off
  # an astro release that cannot hold the sharp patch.
  #
  # Mirrors the push filter plus the three site files that change what gets
  # built or audited. Not `site/**`: prose edits should not spend CI minutes.
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
      - 'atlas/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Atlas needs Node 22 or later and this job sets up no Node, so the
      # check gets its own before the system packages and the Rust build.
      - name: Set up Node for the Atlas check
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.19.0 check

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check (crates)
        run: cargo check -p commandui-runtime-core -p commandui-runtime-persistence -p commandui-runtime-planner

      - name: Cargo test (crates)
        run: cargo test -p commandui-runtime-core -p commandui-runtime-persistence -p commandui-runtime-planner
