name: Release Desktop

# Per-run cost: NOT currently measured. The earlier figure (run 23078003998,
# 2026-03-14, 7m05s wall, 8 billed minutes) predates the MSIX pack step, the
# version check and the publish job, so it no longer describes this workflow.
# Re-measure from a dispatch run and record the wall time here. Release-only;
# no push cost. The publish job runs on ubuntu-latest and only downloads and
# uploads files.
# Dry run: Actions > Release Desktop > Run workflow (workflow_dispatch) on main.
# Dispatch runs are build-only: they skip the version check, and the publish
# job is skipped, so nothing is uploaded to a release. Download the
# commandui-windows artifact to confirm the .msi, .exe and .msix are present.
# The MSIX identity scan is a local pre-upload step (the scanner is absent on
# CI); the pack step emits a notice saying the CI-built package was not scanned.
# Tests run in ci.yml, not here.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # An in-flight publish must finish: cancelling leaves a release with partial assets.
  cancel-in-progress: false

# Read-only by default. Only the publish job below holds contents: write.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      # Tag vs tauri.conf.json, package.json, Cargo.toml and AppxManifest.
      # Pre-release tags (v1.1.0-rc1) are rejected unless the sources carry
      # that exact string. Logic lives in a script so it can be run locally.
      - name: Check release tag matches built version
        if: github.event_name == 'release'
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node packaging/check-release-version.mjs "$env:TAG"

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm --filter @commandui/desktop tauri:build

      - name: Pack unsigned Store MSIX
        shell: pwsh
        run: ./packaging/pack-msix.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commandui-windows
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            release/CommandUI_*_x64.msix

  publish-release:
    needs: build-windows
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commandui-windows
          path: dist

      - name: Upload release artifacts
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          fail_on_unmatched_files: true
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.msix
