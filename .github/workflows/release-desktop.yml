name: Release Desktop

# Per-run cost, measured from a real run (run 23078003998, 2026-03-14):
# one build-windows job on windows-latest, 7m05s wall (8 billed minutes at
# the 2x Windows multiplier). Release-only; no push cost.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # An in-flight publish must finish: cancelling leaves a release with partial assets.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check release tag matches built version
        if: github.event_name == 'release'
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $tag = $env:TAG -replace '^v',''
          $tauri = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $msix = ([xml](Get-Content packaging/msix/AppxManifest.xml -Raw)).Package.Identity.Version -replace '\.0$',''
          Write-Host "tag=$tag tauri.conf.json=$tauri package.json=$pkg AppxManifest=$msix"
          if ($tag -ne $tauri -or $tag -ne $pkg -or $tag -ne $msix) {
            Write-Error "Release tag $env:TAG does not match built versions; bump the sources before tagging."
            exit 1
          }

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: stable

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm --filter @commandui/desktop tauri:build

      - name: Pack unsigned Store MSIX
        shell: pwsh
        run: ./packaging/pack-msix.ps1

      - name: Upload release artifacts
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          fail_on_unmatched_files: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            release/CommandUI_*_x64.msix

      - name: Upload build artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commandui-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            release/CommandUI_*_x64.msix
