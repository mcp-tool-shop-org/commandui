# Line coverage, uploaded by the codecov job in .github/workflows/ci.yml.
#
# Measured 2026-10-04 on this branch: TypeScript 4,664/5,113 lines (91.2%).
# Desktop 4,173/4,611 (90.5%), state 179/182 (98.4%), domain 301/309 (97.4%),
# api-contract 11/11. ui has no executable lines. Rust was 94.2% on 04281cb.
# Decision (Mike, 2026-10-04): both flags are 90% gates, and every PR's new
# lines must be 90% covered.
coverage:
  range: "90...100" # the badge is red below the 90% bar
  status:
    project:
      default: false
      rust:
        flags: [rust]
        target: 90%
        threshold: 0%
        informational: false
      typescript:
        flags: [typescript]
        target: 90%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false

flags:
  rust:
    paths: [crates/, apps/console/, apps/desktop/src-tauri/]
    carryforward: true
  typescript:
    paths: [apps/desktop/src/, packages/]
    carryforward: true

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  require_changes: false
